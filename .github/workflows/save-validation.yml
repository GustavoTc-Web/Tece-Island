name: Validar saves e regras Firestore
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Instalar Godot
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          echo "GODOT_EXE=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          touch node_modules/.gdignore
      - name: Importar e testar persistência
        run: |
          "$GODOT_EXE" --headless --path . --editor --import --quit
          for test in validate_world_library validate_account_progress validate_session_progress validate_save_reliability validate_world_sync validate_chest_bow_save; do
            "$GODOT_EXE" --headless --path . --script "tests/$test.gd"
          done
      - run: npm run test:rules
