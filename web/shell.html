 let db;

  db=await new Promise((resolve,reject)=>{const r=indexedDB.open('tece-island-progress-v4',1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('blocked'));});
  const mode=['read','scan'].includes(operation)?'readonly':'readwrite';
  let tx;try{tx=db.transaction('saves',mode,{durability:'strict'});}catch{tx=db.transaction('saves',mode);}
  const store=tx.objectStore('saves');let value=null,failure=null;
  tx.oncomplete=()=>{db.close();done(JSON.stringify(failure||{ok:true,value}));};
  tx.onabort=()=>{db.close();done(JSON.stringify({ok:false,error:'Falha no armazenamento local. O progresso anterior foi preservado. Tente novamente.'}));};
  tx.onerror=()=>{};
  if(operation==='read'){const r=store.get(key);r.onsuccess=()=>{value=r.result??null;};}
  else if(operation==='scan'){value=[];const r=store.openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return;if(String(c.key).startsWith(key))value.push({key:c.key,value:c.value});c.continue();};}
  else if(operation==='preserve'){const r=store.get(key);r.onsuccess=()=>{if(r.result===undefined)return;const target=key+':'+claim+(claim==='before-cloud'?'':'-'+tcBackupId());const before=store.get(target);before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,target);};};}
  else if(operation==='write'){
   const r=store.get(key);r.onsuccess=()=>{
    if(claim&&JSON.parse(claim).expected!==(r.result??null)){
     store.put(payload,key+':conflict-'+tcBackupId());
     failure={ok:false,conflict:true,error:'Outra sessão alterou este mundo. Sua versão foi preservada como backup; reabra o lobby.'};return;
    }
    if(r.result!==undefined){
     let old;try{old=JSON.parse(r.result);}catch{old=null;}
     if(old&&typeof old==='object'){
      const previous=store.get(key+':backup');previous.onsuccess=()=>{if(previous.result!==undefined)store.put(previous.result,key+':backup-2');store.put(r.result,key+':backup');};
      if(old.inventory&&old.version<5){const before=store.get(key+':before-v5');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-v5');};}
      if(old.inventory&&old.version<6&&JSON.parse(payload).version>=6){const before=store.get(key+':before-v6');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-v6');};}
      if(old.inventory&&old.version<7&&JSON.parse(payload).version>=7){const before=store.get(key+':before-v7');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-v7');};}
      if(old.inventory&&old.version<8&&JSON.parse(payload).version>=8){const before=store.get(key+':before-v8');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-v8');};}
      if(old.campaign?.version===1&&JSON.parse(payload).campaign?.version===2){const before=store.get(key+':before-campaign-v2');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-campaign-v2');};}
      if(old.inventory&&!Object.hasOwn(old,'campaign')&&Object.hasOwn(JSON.parse(payload),'campaign')){const before=store.get(key+':before-campaign-v1');before.onsuccess=()=>{if(before.result===undefined)store.put(r.result,key+':before-campaign-v1');};}
     }else store.put(r.result,key+':unreadable-'+tcBackupId());
    }
    store.put(payload,key);
   };
  }
  else if(operation==='migrate'){const original=store.get(claim);original.onsuccess=()=>{if(original.result===undefined){tx.abort();return;}const backup=store.get(claim+':before-worlds');backup.onsuccess=()=>{if(backup.result===undefined)store.put(original.result,claim+':before-worlds');};const target=store.get(key);target.onsuccess=()=>{if(target.result===undefined)store.put(payload,key);};};}
  else if(operation==='import'){
   const r=store.get('legacy-import-v4');r.onsuccess=()=>{if(r.result!==undefined){tx.abort();return;}const target=store.get(key);target.onsuccess=()=>{if(target.result!==undefined){tx.abort();return;}const imported=JSON.parse(claim);store.put(imported.original,'legacy-original-v4');store.put(payload,key);store.put(imported.uid_hash,'legacy-import-v4');};};
  }else tx.abort();
 }catch(_error){if(db)db.close();done(JSON.stringify({ok:false,error:'Armazenamento do navegador indisponível. Libere espaço e tente novamente.'}));}
}};
// A background/focus save supplements periodic saves; unload is never the only save.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.tcSaveOnHide)window.tcSaveOnHide();});
window.tcRequestPersistence=async()=>navigator.storage?.persist?await navigator.storage.persist():false;
// Read-only diagnostics. Contains game progress, never authentication tokens.
window.tcExportLocalSaves=async()=>{
 const result=await new Promise(resolve=>window.tcLocalProgress.request('scan','', '', '',r=>resolve(JSON.parse(r))));
 if(!result.ok)throw new Error(result.error);
 const blob=new Blob([JSON.stringify({format:1,origin:location.origin,exportedAt:new Date().toISOString(),entries:result.value},null,2)],{type:'application/json'});
 const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='tece-island-saves.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
 return {entries:result.value.length,bytes:blob.size};
};
// Render at display density, capped at 2 to bound fill-rate on mobile GPUs.
function resize(){const r=document.querySelector('#stage').getBoundingClientRect(),density=Math.min(window.devicePixelRatio||1,2);const width=Math.max(1,Math.round(r.width*density)),height=Math.max(1,Math.round(r.height*density));if(canvas.width!==width)canvas.width=width;if(canvas.height!==height)canvas.height=height;}
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(document.querySelector('#stage'));
// Browser zoom or moving between monitors can change DPR without a resize.
function watchDensity(){const query=matchMedia('(resolution: '+devicePixelRatio+'dppx)');query.addEventListener('change',()=>{resize();watchDensity();},{once:true});}
watchDensity();resize();
engine.startGame({canvas,canvasResizePolicy:0,onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;message.textContent='Carregando o jogo… '+Math.round(current/total*100)+'%';}}})
.then(()=>{status.style.display='none';if(!document.querySelector('#auth'))canvas.focus();}).catch(fail);
// Blur and visibility loss reach Godot even when the browser suspends rendering.
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.dispatchEvent(new Event('blur'));});
canvas.addEventListener('webglcontextlost',()=>fail('WebGL context lost'));
